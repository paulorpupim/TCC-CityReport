<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulário de setor</title>
</head>
<body>
    <h1 th:text="${titulo}">Formulário de setor</h1>

    <p><a th:href="@{/atendente/setores}">Voltar para setores</a></p>

    <form th:action="${acao}" th:object="${setor}" method="post">

        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></p>
        </div>

        <p>
            <label for="nome">Nome do setor:</label>
            <input type="text" id="nome" th:field="*{nome}" maxlength="100" required>
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
        </p>

        <button type="submit">Salvar</button>
    </form>
</body>
</html>
