<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil - CityReport</title>
</head>
<body>
    <h1>Meu perfil</h1>

    <p th:if="${mensagemSucesso}" th:text="${mensagemSucesso}"></p>
    <p th:if="${mensagemErro}" th:text="${mensagemErro}"></p>

    <h2>Dados pessoais</h2>

    <!-- O Controller busca o usuário autenticado, sem aceitar ID do formulário. -->
    <form th:action="@{/cidadaos/perfil}" th:object="${usuarioDTO}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></p>
        </div>

        <p>
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" th:field="*{nome}" maxlength="100" autocomplete="name" required>
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
        </p>

        <p>
            <label for="email">E-mail:</label>
            <input type="email" id="email" th:field="*{email}" maxlength="150" autocomplete="email" required>
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </p>

        <p>Se alterar seu e-mail, será necessário entrar novamente.</p>
        <button type="submit">Salvar dados</button>
    </form>

    <h2>Alterar senha</h2>

    <form th:action="@{/cidadaos/perfil/senha}" method="post">
        <p>
            <label for="senhaAtual">Senha atual:</label>
            <input type="password" id="senhaAtual" name="senhaAtual"
                   autocomplete="current-password" required>
        </p>

        <p>
            <label for="novaSenha">Nova senha (mínimo de 8 caracteres):</label>
            <input type="password" id="novaSenha" name="novaSenha"
                   minlength="8" autocomplete="new-password" required>
        </p>

        <button type="submit">Alterar senha</button>
    </form>

    <h2>Sessão</h2>
    <form th:action="@{/logout}" method="post">
        <button type="submit">Sair</button>
    </form>
</body>
</html>
