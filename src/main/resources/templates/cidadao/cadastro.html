<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de cidadão - CityReport</title>
</head>
<body>
    <h1>Criar conta de cidadão</h1>

    <p><a th:href="@{/login}">Já tenho conta: entrar</a></p>

    <!-- O perfil CIDADAO é determinado pelo backend, nunca pelo formulário. -->
    <form th:action="@{/cidadaos/cadastro}" th:object="${usuarioDTO}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></p>
        </div>

        <p>
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" th:field="*{nome}" maxlength="100" autocomplete="name" required>
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
        </p>

        <p>
            <label for="email">E-mail:</label>
            <input type="email" id="email" th:field="*{email}" maxlength="150" autocomplete="email" required>
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </p>

        <p>
            <label for="senha">Senha (mínimo de 8 caracteres):</label>
            <input type="password" id="senha" th:field="*{senha}"
                   minlength="8" autocomplete="new-password" required>
            <span th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></span>
        </p>

        <button type="submit">Criar conta</button>
    </form>
</body>
</html>
