<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
    <header class="home-header" th:fragment="cidadao(abaAtiva)">
        <div class="home-header-inner">
            <a class="home-brand" th:href="@{/}" href="/" aria-label="CityReport — início">
                <img th:src="@{/img/logo/logo.svg}" src="/img/logo/logo.svg" alt="" class="home-brand-icon" width="48" height="48">
                <span class="home-brand-copy">
                    <span class="home-brand-name">CITY<span>REPORT</span></span>
                    <span class="home-brand-subtitle">PORTAL DO CIDADÃO</span>
                </span>
            </a>
            <nav class="home-nav" aria-label="Navegação do cidadão">
                <a class="home-nav-link" th:href="@{/}" href="/"
                   th:classappend="${abaAtiva == 'inicio'} ? 'is-current' : ''"
                   th:attr="aria-current=${abaAtiva == 'inicio' ? 'page' : null}">Início</a>
                <a class="home-nav-link" th:href="@{/chamados/novo}" href="/chamados/novo"
                   th:classappend="${abaAtiva == 'novo'} ? 'is-current' : ''"
                   th:attr="aria-current=${abaAtiva == 'novo' ? 'page' : null}">Abrir chamado</a>
                <a class="home-nav-link" th:href="@{/chamados}" href="/chamados"
                   th:classappend="${abaAtiva == 'chamados'} ? 'is-current' : ''"
                   th:attr="aria-current=${abaAtiva == 'chamados' ? 'page' : null}">Meus chamados</a>
            </nav>
            <!-- Menu de perfil do cidadão: reaproveita os estilos do menu do atendente. -->
            <details class="home-account-menu">
                <summary class="home-account-toggle" aria-label="Abrir opções da conta do cliente">
                    <span class="home-account-role">Cliente</span>
                    <span class="home-account-avatar" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path>
                        </svg>
                    </span>
                    <svg class="home-account-chevron" viewBox="0 0 24 24" width="16" height="16"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                         stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="m6 9 6 6 6-6"></path>
                    </svg>
                </summary>
                <div class="home-account-dropdown">
                    <a class="home-account-action"
                       th:href="@{/cidadaos/perfil}" href="/cidadaos/perfil"
                       th:classappend="${abaAtiva == 'perfil'} ? 'is-current' : ''"
                       th:attr="aria-current=${abaAtiva == 'perfil' ? 'page' : null}">Meu perfil</a>
                    <form class="home-account-logout" th:action="@{/logout}" action="/logout" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="home-account-action home-account-signout" type="submit">Sair</button>
                    </form>
                </div>
            </details>
        </div>
    </header>

    <header class="home-header" th:fragment="atendente(abaAtiva)">
        <div class="home-header-inner">
            <a class="home-brand" th:href="@{/}" href="/" aria-label="CityReport — início">
                <img th:src="@{/img/logo/logo.svg}" src="/img/logo/logo.svg" alt="" class="home-brand-icon" width="48" height="48">
                <span class="home-brand-copy">
                    <span class="home-brand-name">CITY<span>REPORT</span></span>
                    <span class="home-brand-subtitle">PORTAL ADMINISTRATIVO</span>
                </span>
            </a>
            <nav class="home-nav" aria-label="Navegação administrativa">
                <a class="home-nav-link" th:href="@{/}" href="/"
                   th:classappend="${abaAtiva == 'inicio'} ? 'is-current' : ''"
                   th:attr="aria-current=${abaAtiva == 'inicio' ? 'page' : null}">Início</a>
                <a class="home-nav-link" th:href="@{/atendente/chamados}" href="/atendente/chamados"
                   th:classappend="${abaAtiva == 'chamados'} ? 'is-current' : ''"
                   th:attr="aria-current=${abaAtiva == 'chamados' ? 'page' : null}">Chamados</a>
                <a class="home-nav-link" th:href="@{/atendente/usuarios}" href="/atendente/usuarios"
                   th:classappend="${abaAtiva == 'usuarios'} ? 'is-current' : ''"
                   th:attr="aria-current=${abaAtiva == 'usuarios' ? 'page' : null}">Usuários</a>
                <a class="home-nav-link" th:href="@{/atendente/categorias}" href="/atendente/categorias"
                   th:classappend="${abaAtiva == 'categorias'} ? 'is-current' : ''"
                   th:attr="aria-current=${abaAtiva == 'categorias' ? 'page' : null}">Categorias</a>
                <a class="home-nav-link" th:href="@{/atendente/setores}" href="/atendente/setores"
                   th:classappend="${abaAtiva == 'setores'} ? 'is-current' : ''"
                   th:attr="aria-current=${abaAtiva == 'setores' ? 'page' : null}">Setores</a>
            </nav>
            <!-- Menu de conta: apenas para o atendente. Sem JavaScript ou bibliotecas. -->
            <details class="home-account-menu">
                <summary class="home-account-toggle" aria-label="Abrir opções da conta do atendente">
                    <span class="home-account-role">Atendente</span>
                    <span class="home-account-avatar" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path>
                        </svg>
                    </span>
                    <svg class="home-account-chevron" viewBox="0 0 24 24" width="16" height="16"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                         stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="m6 9 6 6 6-6"></path>
                    </svg>
                </summary>
                <div class="home-account-dropdown">
                    <a class="home-account-action"
                       th:href="@{/atendente/minha-senha}" href="/atendente/minha-senha"
                       th:classappend="${abaAtiva == 'minha-senha'} ? 'is-current' : ''"
                       th:attr="aria-current=${abaAtiva == 'minha-senha' ? 'page' : null}">Alterar senha</a>
                    <form class="home-account-logout" th:action="@{/logout}" action="/logout" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="home-account-action home-account-signout" type="submit">Sair</button>
                    </form>
                </div>
            </details>
        </div>
    </header>
</body>
</html>
