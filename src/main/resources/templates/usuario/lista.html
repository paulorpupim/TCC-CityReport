<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar usuários - CityReport</title>
</head>
<body>
    <h1>Gerenciar usuários internos</h1>

    <nav>
        <a th:href="@{/atendente/setores}">Setores</a> |
        <a th:href="@{/atendente/categorias}">Categorias</a> |
        <a th:href="@{/atendente/usuarios}">Usuários</a>
    </nav>

    <p><a th:href="@{/atendente/usuarios/novo}">Cadastrar usuário</a></p>

    <p th:if="${mensagemSucesso}" th:text="${mensagemSucesso}"></p>
    <p th:if="${mensagemErro}" th:text="${mensagemErro}"></p>

    <h2>Atendentes</h2>
    <p th:if="${#lists.isEmpty(atendentes)}">Nenhum atendente cadastrado.</p>

    <table th:unless="${#lists.isEmpty(atendentes)}">
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Nome</th>
                <th scope="col">E-mail</th>
                <th scope="col">Situação</th>
                <th scope="col">Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="atendente : ${atendentes}">
                <td th:text="${atendente.id}"></td>
                <td th:text="${atendente.nome}"></td>
                <td th:text="${atendente.email}"></td>
                <td th:text="${atendente.ativo} ? 'Ativo' : 'Inativo'"></td>
                <td>
                    <a th:href="@{/atendente/usuarios/{id}/editar(id=${atendente.id})}">Editar</a>

                    <form th:if="${atendente.ativo}"
                          th:action="@{/atendente/usuarios/{id}/desativar(id=${atendente.id})}"
                          method="post">
                        <button type="submit">Desativar</button>
                    </form>

                    <form th:unless="${atendente.ativo}"
                          th:action="@{/atendente/usuarios/{id}/ativar(id=${atendente.id})}"
                          method="post">
                        <button type="submit">Ativar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <h2>Funcionários de campo</h2>
    <p th:if="${#lists.isEmpty(funcionarios)}">Nenhum funcionário cadastrado.</p>

    <table th:unless="${#lists.isEmpty(funcionarios)}">
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Nome</th>
                <th scope="col">E-mail</th>
                <th scope="col">Setor</th>
                <th scope="col">Situação</th>
                <th scope="col">Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="funcionario : ${funcionarios}">
                <td th:text="${funcionario.id}"></td>
                <td th:text="${funcionario.nome}"></td>
                <td th:text="${funcionario.email}"></td>
                <td th:text="${funcionario.setor != null ? funcionario.setor.nome : 'Sem setor'}"></td>
                <td th:text="${funcionario.ativo} ? 'Ativo' : 'Inativo'"></td>
                <td>
                    <a th:href="@{/atendente/usuarios/{id}/editar(id=${funcionario.id})}">Editar</a>

                    <form th:if="${funcionario.ativo}"
                          th:action="@{/atendente/usuarios/{id}/desativar(id=${funcionario.id})}"
                          method="post">
                        <button type="submit">Desativar</button>
                    </form>

                    <form th:unless="${funcionario.ativo}"
                          th:action="@{/atendente/usuarios/{id}/ativar(id=${funcionario.id})}"
                          method="post">
                        <button type="submit">Ativar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
