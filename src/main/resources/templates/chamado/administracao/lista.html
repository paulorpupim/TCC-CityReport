<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar chamados - CityReport</title>
</head>
<body>
    <h1>Gerenciar chamados</h1>

    <nav>
        <a th:href="@{/atendente/chamados}">Chamados</a> |
        <a th:href="@{/atendente/categorias}">Categorias</a> |
        <a th:href="@{/atendente/setores}">Setores</a> |
        <a th:href="@{/atendente/usuarios}">Usuários</a> |
        <a th:href="@{/cidadaos/perfil}">Meu perfil</a>
    </nav>

    <p th:if="${mensagemSucesso}" th:text="${mensagemSucesso}"></p>
    <p th:if="${mensagemErro}" th:text="${mensagemErro}"></p>

    <p th:if="${#lists.isEmpty(chamados)}">Nenhum chamado registrado.</p>

    <table th:unless="${#lists.isEmpty(chamados)}">
        <thead>
            <tr>
                <th scope="col">Protocolo</th>
                <th scope="col">Título</th>
                <th scope="col">Categoria</th>
                <th scope="col">Cidadão</th>
                <th scope="col">Status</th>
                <th scope="col">Prioridade oficial</th>
                <th scope="col">Criado em</th>
                <th scope="col">Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="chamado : ${chamados}">
                <td th:text="${chamado.id}"></td>
                <td th:text="${chamado.titulo}"></td>
                <td th:text="${chamado.categoria.nome}"></td>
                <td th:text="${chamado.cidadao.nome}"></td>
                <td th:text="${chamado.status}"></td>
                <td th:text="${chamado.prioridadeOficial != null ? chamado.prioridadeOficial : 'Não definida'}"></td>
                <td th:text="${#temporals.format(chamado.dataCriacao, 'dd/MM/yyyy HH:mm')}"></td>
                <td>
                    <a th:href="@{/atendente/chamados/{id}(id=${chamado.id})}">Analisar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
