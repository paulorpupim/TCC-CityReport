<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar chamados - CityReport</title>
</head>
<body>
    <h1>Gerenciar chamados</h1>

    <nav>
        <a th:href="@{/atendente/chamados}">Chamados</a> |
        <a th:href="@{/atendente/categorias}">Categorias</a> |
        <a th:href="@{/atendente/setores}">Setores</a> |
        <a th:href="@{/atendente/usuarios}">Usuários</a>
    </nav>

    <p th:if="${mensagemSucesso}" th:text="${mensagemSucesso}"></p>
    <p th:if="${mensagemErro}" th:text="${mensagemErro}"></p>

    <section aria-labelledby="titulo-filtros">
        <h2 id="titulo-filtros">Pesquisar e filtrar chamados</h2>
        <form th:action="@{/atendente/chamados}" method="get">
            <div>
                <label for="busca">Protocolo ou título</label>
                <input type="search" id="busca" name="busca" maxlength="150"
                       placeholder="Ex.: 2026-000001 ou buraco" th:value="${busca}">
            </div>

            <div>
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="">Todos os status</option>
                    <option th:each="opcao : ${statusDisponiveis}"
                            th:value="${opcao.name()}"
                            th:text="${#strings.replace(opcao.name(), '_', ' ')}"
                            th:selected="${opcao == statusSelecionado}">Status</option>
                </select>
            </div>

            <div>
                <label for="prioridade">Prioridade oficial</label>
                <select id="prioridade" name="prioridade">
                    <option value="">Todas as prioridades</option>
                    <option th:each="opcao : ${prioridades}"
                            th:value="${opcao.name()}"
                            th:text="${opcao.name()}"
                            th:selected="${opcao == prioridadeSelecionada}">Prioridade</option>
                </select>
            </div>

            <div>
                <label for="categoriaId">Categoria</label>
                <select id="categoriaId" name="categoriaId">
                    <option value="">Todas as categorias</option>
                    <option th:each="categoria : ${categorias}"
                            th:value="${categoria.id}"
                            th:text="${categoria.nome + ' — ' + categoria.setor.nome + (categoria.ativo ? '' : ' (inativa)')}"
                            th:selected="${categoria.id == categoriaSelecionada}">Categoria</option>
                </select>
            </div>

            <button type="submit">Pesquisar</button>
            <a th:href="@{/atendente/chamados}">Limpar filtros</a>
        </form>
    </section>

    <p th:text="|Chamados encontrados: ${#lists.size(chamados)}|"></p>
    <p th:if="${#lists.isEmpty(chamados)}"
       th:text="${filtrosAplicados} ? 'Nenhum chamado corresponde aos filtros informados.' : 'Nenhum chamado registrado.'"></p>

    <table th:unless="${#lists.isEmpty(chamados)}">
        <thead>
            <tr>
                <th scope="col">Protocolo</th>
                <th scope="col">Título</th>
                <th scope="col">Categoria</th>
                <th scope="col">Cidadão</th>
                <th scope="col">Status</th>
                <th scope="col">Prioridade oficial</th>
                <th scope="col">Criado em</th>
                <th scope="col">Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="chamado : ${chamados}">
                <td th:text="${chamado.protocolo}"></td>
                <td th:text="${chamado.titulo}"></td>
                <td th:text="${chamado.categoria.nome}"></td>
                <td th:text="${chamado.cidadao.nome}"></td>
                <td th:text="${chamado.status}"></td>
                <td th:text="${chamado.prioridadeOficial != null ? chamado.prioridadeOficial : 'Não definida'}"></td>
                <td th:text="${#temporals.format(chamado.dataCriacao, 'dd/MM/yyyy HH:mm')}"></td>
                <td>
                    <a th:href="@{/atendente/chamados/{id}(id=${chamado.id})}">Analisar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
