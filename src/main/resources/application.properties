spring.application.name=cityreport

spring.datasource.url=jdbc:postgresql://localhost:5432/cityreport
spring.datasource.username=postgres
spring.datasource.password=postdba

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Configuracoes de upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Diretorio de armazenamento das fotografias
cityreport.upload.dir=uploads/chamados