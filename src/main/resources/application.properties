
spring.application.name=cityreport

# Importar configuracoes privadas
spring.config.import=optional:file:./application-secrets.properties

# Configuracoes do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Configuracoes do Thymeleaf
spring.thymeleaf.cache=false

# Configuracoes de upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Diretorio de armazenamento das fotografias
cityreport.upload.dir=uploads/chamados
