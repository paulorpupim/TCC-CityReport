spring.application.name=cityreport

# Importar configuracoes do Supabase, se existirem
spring.config.import=optional:file:./application-secrets.properties

# Banco local (padrao)
spring.datasource.url=jdbc:postgresql://localhost:5432/cityreport
spring.datasource.username=postgres
spring.datasource.password=postdba

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Configuracoes de upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Diretorio de armazenamento das fotografias
cityreport.upload.dir=uploads/chamados

cityreport.localizacao.latitude-minima=-20.3610
cityreport.localizacao.latitude-maxima=-20.2110

cityreport.localizacao.longitude-minima=-50.4740
cityreport.localizacao.longitude-maxima=-50.3240